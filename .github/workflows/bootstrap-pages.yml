name: Bootstrap Mawzoon Web Demo

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap-pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mawzoon-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public demo repo
        uses: actions/checkout@v4

      - name: Download compiled Mawzoon V5 web build
        run: |
          curl -fL 'https://sdmntprukwest.oaiusercontent.com/files/00000000-c968-8243-814c-3e98f8d24041/raw?se=2026-10-05T00%3A20%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=0454575d-01c3-5fff-b0b0-a728d14c566b&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T17%3A51%3A37Z&ske=2026-10-05T17%3A51%3A37Z&sks=b&skv=2026-02-06&sig=9CCq6as8GwdL3SiCTQqA8%2BzOxTsOSOs7Z%2BHgCJzMutQ%3D' -o mawzoon-web.zip
          rm -rf docs _web
          mkdir _web
          unzip -q mawzoon-web.zip -d _web
          mv _web docs

      - name: Configure GitHub Pages base path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()
          s = s.replace('<base href="/">', '<base href="/Mawzoon-Web-Demo/">')
          p.write_text(s)
          Path('docs/.nojekyll').write_text('')
          PY

      - name: Commit compiled demo files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'Publish Mawzoon V5 web demo [pages-build]' || true
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
